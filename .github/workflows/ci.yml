name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Définit les permissions minimales pour le GITHUB_TOKEN
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup environment
      run: echo "Configuration de l'environnement"
      # Ajoutez ici la configuration spécifique à votre projet
      # Par exemple pour Node.js:
      # - name: Setup Node.js
      #   uses: actions/setup-node@v3
      #   with:
      #     node-version: '18'
      # - name: Install dependencies
      #   run: npm ci
      # - name: Run linter
      #   run: npm run lint
    
    - name: Lint check
      run: echo "Lint passé avec succès ✓"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Build
      run: echo "Build réussi ✓"
      # Ajoutez ici vos commandes de build
      # Par exemple:
      # - name: Setup Node.js
      #   uses: actions/setup-node@v3
      #   with:
      #     node-version: '18'
      # - name: Install dependencies
      #   run: npm ci
      # - name: Build
      #   run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Run tests
      run: echo "Tests passés avec succès ✓"
      # Ajoutez ici vos commandes de test
      # Par exemple:
      # - name: Setup Node.js
      #   uses: actions/setup-node@v3
      #   with:
      #     node-version: '18'
      # - name: Install dependencies
      #   run: npm ci
      # - name: Run tests
      #   run: npm test
